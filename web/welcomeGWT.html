<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>RgB | TEI Document Viewer</title>
    
    <!-- GWT module meta tag -->
    <meta name="gwt:property" content="locale=it">
    
    <!-- Application styles -->
    <link rel="stylesheet" type="text/css" href="rgb.css">
    
    <!-- Prevent caching during development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
        /* Loading indicator */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            color: #333;
        }
        #loading img {
            display: block;
            margin: 0 auto 10px;
        }
    </style>
</head>
<body>
    <!-- Loading indicator (hidden when GWT loads) -->
    <div id="loading">
        <img src="images/loading.gif" alt="Loading...">
        <span>Caricamento applicazione...</span>
    </div>

    <!-- GWT history support -->
    <iframe src="javascript:''" id="__gwt_historyFrame" tabIndex="-1" 
            style="position:absolute;width:0;height:0;border:0"></iframe>
    
    <!-- OPTIONAL: include this if you want history support -->
    <noscript>
        <div style="width: 22em; position: absolute; left: 50%; margin-left: -11em; color: red; background-color: white; border: 1px solid red; padding: 4px; font-family: sans-serif">
            Il tuo browser non supporta JavaScript o è disabilitato.
            <br>
            Per utilizzare questa applicazione, abilita JavaScript.
        </div>
    </noscript>

    <!-- GWT compiled JavaScript -->
    <script type="text/javascript" src="Main/Main.nocache.js"></script>
</body>
</html>
